name: Build minecraftKw v1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython==0.29.36"
          pip install "buildozer==1.6.0"

      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer android debug 2>&1 | tee build.log

      - name: Find APK
        if: always()
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -print || true
          echo "=== BIN DIRECTORY ==="
          ls -lah bin 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minecraftKw-v1-apk
          path: |
            bin/*.apk
            **/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraftKw-v1-build-log
          path: build.log
          if-no-files-found: warn
