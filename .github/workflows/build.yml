name: Build minecraftKw v1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip autoconf automake libtool \
            pkg-config libltdl-dev libffi-dev \
            libssl-dev libsqlite3-dev zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "buildozer==1.6.0" "cython<3.1"

      - name: Build APK
        run: |
          buildozer android debug 2>&1 | tee build.log

      - name: Find APK
        run: |
          echo "=== Mencari file APK ==="
          find . -type f -name "*.apk" -print

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "❌ APK tidak ditemukan!"
            echo ""
            echo "=== Isi folder bin ==="
            ls -lah bin/ 2>/dev/null || true
            echo ""
            echo "=== Isi folder .buildozer ==="
            find .buildozer -maxdepth 5 -type f 2>/dev/null | head -100 || true
            exit 1
          fi

          echo "✅ APK ditemukan:"
          find . -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          APK=$(find . -type f -name "*.apk" | head -n 1)
          echo "APK yang dipakai: $APK"
          cp "$APK" artifacts/minecraftKw-v1.apk
          ls -lh artifacts/minecraftKw-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minecraftKw-v1-apk
          path: artifacts/minecraftKw-v1.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraftKw-v1-build-log
          path: build.log
          if-no-files-found: warn
