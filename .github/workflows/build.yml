name: Build minecraftKw v1 APK (Debug)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip autoconf automake libtool \
            pkg-config libltdl-dev libffi-dev \
            libssl-dev libsqlite3-dev zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "buildozer==1.6.0" "cython<3.1"
          buildozer --version

      - name: Check buildozer.spec
        run: |
          echo "=== Checking buildozer.spec ==="
          if [ -f buildozer.spec ]; then
            echo "✅ buildozer.spec found"
            echo ""
            echo "=== First 50 lines of buildozer.spec ==="
            head -50 buildozer.spec
          else
            echo "❌ buildozer.spec NOT found!"
            echo "Current directory: $(pwd)"
            echo "Files in root:"
            ls -lah
            exit 1
          fi

      - name: Build APK
        run: |
          echo "=== Starting Buildozer build ==="
          buildozer android debug 2>&1 | tee build.log
          BUILD_EXIT=$?
          echo "Buildozer exit code: $BUILD_EXIT"
          exit $BUILD_EXIT

      - name: Debug - List all files after build
        if: always()
        run: |
          echo "=== All .apk files ==="
          find . -type f -name "*.apk" 2>/dev/null || echo "❌ No .apk files found"
          
          echo ""
          echo "=== .buildozer directory structure ==="
          if [ -d .buildozer ]; then
            find .buildozer -type f \( -name "*.apk" -o -name "*.apk.idsig" \) 2>/dev/null || echo "No APK files in .buildozer"
            echo ""
            echo "=== Last 20 lines of .buildozer ==="
            find .buildozer -type f | tail -20
          else
            echo "❌ .buildozer directory not found"
          fi
          
          echo ""
          echo "=== bin directory ==="
          if [ -d bin ]; then
            ls -lah bin/
          else
            echo "❌ bin directory not found"
          fi
          
          echo ""
          echo "=== Last 50 lines of build.log ==="
          tail -50 build.log

      - name: Find APK
        run: |
          echo "=== Mencari file APK ==="
          APK=$(find . -type f -name "*.apk" | head -n 1)
          
          if [ -z "$APK" ]; then
            echo "❌ APK tidak ditemukan!"
            echo ""
            echo "=== ERROR SUMMARY ==="
            echo "Build mungkin gagal. Lihat build.log untuk detail:"
            grep -i "error\|failed\|exception" build.log | head -20 || echo "Tidak ada error patterns terlihat"
            exit 1
          fi
          
          echo "✅ APK ditemukan: $APK"
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          echo "APK path: $APK_PATH"
          ls -lh "$APK_PATH"
          cp "$APK_PATH" artifacts/minecraftKw-v1.apk
          echo "✅ APK copied to artifacts/"
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minecraftKw-v1-apk
          path: artifacts/minecraftKw-v1.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraftKw-v1-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload .buildozer directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-directory
          path: .buildozer/
          if-no-files-found: warn
